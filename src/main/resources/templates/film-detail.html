<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail du film - Ghibli Explorer</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<p th:if="${erreur != null}" th:text="${erreur}"></p>

<div th:if="${film != null}">
    <h1 th:text="${film.title}">Titre du film</h1>

    <img th:if="${film.image != null and !film.image.isEmpty()}"
         th:src="${film.image}"
         th:alt="${film.title}"
         style="max-width: 300px;">

    <p>
        <strong>Réalisateur :</strong>
        <span th:text="${film.director}"></span>
    </p>

    <p>
        <strong>Date de sortie :</strong>
        <span th:text="${film.releaseDate}"></span>
    </p>

    <h2>Description</h2>
    <p th:text="${film.description}"></p>
</div>

<a href="/films">Retour aux films</a>

</body>
</html>
